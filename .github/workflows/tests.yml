name: tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php-8.1-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php-8.1-
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Restore PHPStan cache
        uses: actions/cache/restore@v5
        with:
          path: build/phpstan
          key: ${{ runner.os }}-phpstan-php-8.1-${{ hashFiles('composer.lock', 'phpstan.neon.dist') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-phpstan-php-8.1-${{ hashFiles('composer.lock', 'phpstan.neon.dist') }}-

      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=1G

      - name: Save PHPStan cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: build/phpstan
          key: ${{ runner.os }}-phpstan-php-8.1-${{ hashFiles('composer.lock', 'phpstan.neon.dist') }}-${{ github.run_id }}

  tests:
    name: Tests / PHP ${{ matrix.php }} / Illuminate ${{ matrix.illuminate }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            illuminate: '10.*'
          - php: '8.2'
            illuminate: '11.*'
          - php: '8.2'
            illuminate: '12.*'
          - php: '8.3'
            illuminate: '13.*'
          - php: '8.4'
            illuminate: '13.*'
          - php: '8.5'
            illuminate: '13.*'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php-${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: Select Illuminate version
        run: |
          composer config platform.php "${{ matrix.php }}"
          composer require --no-interaction --no-update \
            "illuminate/container:${{ matrix.illuminate }}" \
            "illuminate/support:${{ matrix.illuminate }}" \
            "illuminate/translation:${{ matrix.illuminate }}" \
            "illuminate/validation:${{ matrix.illuminate }}"

      - name: Install PHP dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --with-all-dependencies

      - name: Tests
        run: vendor/bin/phpunit
